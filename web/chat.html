<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Марфа — Чат</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#10b981;--danger:#ef4444;--user:#dbeafe;--agent:#f3f4f6;--border:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;margin:0}
.status{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.dot.off{background:var(--danger)}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:20px}
#messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:75%;padding:10px 14px;border-radius:12px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--user)}
.bubble.agent{align-self:flex-start;background:var(--agent)}
.bubble.system{align-self:center;background:transparent;color:var(--muted);font-size:12px;font-style:italic}
.bubble.error{align-self:center;background:#fee2e2;color:var(--danger);font-size:12px;border:1px solid var(--danger)}
.meta{font-size:11px;color:var(--muted);margin-top:4px}
footer{background:var(--card);border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:10px;align-items:center}
#input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:none;font-family:inherit;max-height:60px}
button{padding:10px 18px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-weight:500}
button:disabled{background:var(--muted);cursor:not-allowed}
button.secondary{background:var(--agent);color:var(--text)}
.typing::after{content:'▊';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<header>
<h1>Марфа — Чат</h1>
<span class="status"><span class="dot" id="brainDot"></span>мозг: <span id="brainStatus">—</span></span>
<span style="flex:1"></span>
<button class="secondary" onclick="clearChat()">очистить</button>
<a href="/" style="text-decoration:none;color:var(--muted);font-size:13px">← панель</a>
</header>
<main>
<div id="messages">
<div class="bubble system">Привет. Я Марфа. Спрашивай что угодно.</div>
</div>
</main>
<footer>
<textarea id="input" rows="1" placeholder="Сообщение Марфе… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
<button id="sendBtn" onclick="send()">Отправить</button>
</footer>
<script>
const MSGS=document.getElementById('messages');
const INPUT=document.getElementById('input');
const SEND=document.getElementById('sendBtn');
INPUT.addEventListener('input',()=>{INPUT.style.height='auto';INPUT.style.height=Math.min(INPUT.scrollHeight,60)+'px'});
INPUT.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function addBubble(text,cls){const d=document.createElement('div');d.className='bubble '+cls;d.textContent=text;MSGS.appendChild(d);MSGS.scrollTop=MSGS.scrollHeight;return d}
async function send(){
const text=INPUT.value.trim();if(!text)return;
INPUT.value='';INPUT.style.height='auto';SEND.disabled=true;
addBubble(text,'user');
const b=addBubble('','agent typing');
try{
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
const data=await r.json();
b.classList.remove('typing');
b.textContent=data.reply||'(пустой ответ)';
if(data.elapsed_ms){const m=document.createElement('div');m.className='meta';m.textContent=data.elapsed_ms+' мс';b.appendChild(m)}
}catch(e){b.classList.remove('typing');b.textContent='Ошибка связи: '+e.message;b.className='bubble error'}
finally{SEND.disabled=false;INPUT.focus()}
}
function clearChat(){if(!confirm('Очистить историю чата?'))return;MSGS.innerHTML='';addBubble('История очищена.','system')}
async function checkBrain(){
try{const r=await fetch('/api/brain_health');const d=await r.json();
const dot=document.getElementById('brainDot'),st=document.getElementById('brainStatus');
if(d.healthy){dot.classList.remove('off');st.textContent='здоров'}else{dot.classList.add('off');st.textContent='недоступен'}
}catch{document.getElementById('brainStatus').textContent='ошибка'}
}
checkBrain();setInterval(checkBrain,15000);
</script>
</body>
</html>
