<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Марфа</title>
    <style>
        body { font-family: Arial; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh;
               --bg:#0d1117; --hdr:#161b22; --card:#21262d; --border:#30363d; --text:#c9d1d9; --input:#0d1117; }
        body.light { --bg:#f6f8fa; --hdr:#eaeef2; --card:#ffffff; --border:#d0d7de; --text:#1f2328; --input:#ffffff; }
        header { padding: 15px; background: var(--hdr); border-bottom: 1px solid var(--border); font-size: 18px; font-weight: bold;
                 display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .widgets { font-size: 13px; font-weight: normal; display: flex; align-items: center; gap: 6px; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #6e7681; }
        .dot.ok { background: #2ea043; } .dot.down { background: #d29922; }
        #theme { padding: 6px 12px; font-size: 13px; font-weight: normal; background: var(--card); color: var(--text);
                 border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 70%; line-height: 1.4; white-space: pre-wrap; }
        .user { background: #1f6feb; color: white; align-self: flex-end; }
        .ai { background: var(--card); border: 1px solid var(--border); color: var(--text); align-self: flex-start; }
        .ai code { background: rgba(110,118,129,0.3); border-radius: 4px; padding: 1px 5px; font-family: Consolas, monospace; font-size: 0.95em; }
        .ai pre { background: var(--input); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
                  overflow-x: auto; white-space: pre-wrap; margin: 6px 0; }
        .ai pre code { background: none; padding: 0; }
        .ai h3, .ai h4, .ai h5 { margin: 8px 0 4px; }
        .ai p { margin: 4px 0; }
        .ai ul, .ai ol { margin: 4px 0; padding-left: 22px; }
        #input-area { padding: 15px; background: var(--hdr); display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: var(--text); outline: none; }
        button { padding: 12px 20px; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        .meta { font-size: 11px; color: #6e7681; align-self: center; }
        /* ЭФИР: индикатор думания — Марфа показывает, что жива и чем занята */
        .typing { background: var(--card); border: 1px dashed var(--border); color: var(--text);
                  align-self: flex-start; padding: 10px 15px; border-radius: 10px; font-size: 13px; }
        .typing .dots::after { content: ''; animation: dots 1.2s steps(4, end) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
        .typing .stage { display: block; margin-top: 4px; opacity: 0.75; max-width: 320px; }
        # СКОРОСТЬ v1: живой черновик — мозг печатает ответ прямо в чат
        .typing .preview { display: block; margin-top: 6px; max-width: 340px;
                           font-style: italic; opacity: 0.9; white-space: pre-wrap;
                           border-left: 2px solid var(--border); padding-left: 8px; }
        .stamp { font-size: 11px; color: #6e7681; align-self: flex-start; margin-top: -6px; padding-left: 8px; }
        /* МОСТ УШЕЙ: пометка под фразой Создателя, сказанной голосом */
        .vt { font-size: 11px; color: #6e7681; align-self: flex-end; margin-top: -6px; padding-right: 8px; }
        /* №14 «кнопка глаз»: взгляд одним кликом — превью + описание */
        #eye { padding: 6px 12px; font-size: 13px; font-weight: normal; background: var(--card); color: var(--text);
               border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
        #eye:disabled { opacity: 0.5; cursor: wait; }
        .glance { background: var(--card); border: 1px solid var(--border); color: var(--text);
                  align-self: flex-start; padding: 10px 15px; border-radius: 10px; max-width: 70%; }
        .glance img { max-width: 100%; border-radius: 6px; margin-top: 6px; display: block; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <header>
        <span>Марфа</span>
        <span class="widgets">
            <span class="dot" id="w-panel" title="панель"></span>панель
            <span class="dot" id="w-brain" title="мозг 8082"></span>мозг
            <span class="dot" id="w-eyes" title="глаза 8083"></span>глаза
            <button id="eye" onclick="look()" title="посмотреть на экран одним кликом">глаз</button>
            <button id="theme" onclick="toggleTheme()" title="сменить оформление">день</button>
        </span>
    </header>
    <div id="chat"><div class="msg ai">Привет! Я Марфа. Спрашивай что угодно.</div></div>
    <div id="input-area">
        <input id="inp" placeholder="Напиши Марфе..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()">Отправить</button>
    </div>
    <script>
        // №11: имя сессии живёт в localStorage — F5 не рвёт разговор.
        // Сама история ходов — в доме (data/dialog/): переживает и рестарт панели.
        let SID = localStorage.getItem('marfa-session');
        if (!SID) {
            SID = 's' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
            localStorage.setItem('marfa-session', SID);
        }

        // XSS-гигиена (№12 из роадмапа-30): ВСЁ показываемое — через esc()
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ЭФИР: секунды по-русски — «12,4», не «12.4»
        function fmtSecs(x) {
            return (Math.round(Number(x || 0) * 10) / 10).toString().replace('.', ',');
        }

        // штамп под ответом: «12,4 с · мозг · 84 ток» — время И объём:
        // если снова медленно — по токенам видно, кто съел время.
        // Аудит-2: большой промпт (ptok >= 1000) подписывается честно —
        // «165,8 с · мозг · 273 ток · промпт 2100»: это префикс так думал
        function addStamp(secs, label, tok, ptok) {
            if (secs === null || secs === undefined) return;
            const c = document.getElementById('chat');
            const d = document.createElement('div');
            d.className = 'stamp';
            d.textContent = fmtSecs(secs) + ' с · ' + (label || '') +
                            (tok ? ' · ' + tok + ' ток' : '') +
                            (ptok && ptok >= 1000 ? ' · промпт ' + ptok : '');
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function add(role, text, html) {
            const c = document.getElementById('chat');
            const d = document.createElement('div');
            d.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
            // №12: ответы Марфы — готовый HTML с сервера (сервер экранировал
            // всё до разметки); всё остальное — textContent, не innerHTML
            if (role === 'ai' && html) d.innerHTML = html;
            else d.textContent = text;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        // №13: живой статус-виджет — три точки в шапке, опрос раз в 30 с
        function widget(id, ok) {
            const el = document.getElementById(id);
            if (el) el.className = 'dot ' + (ok ? 'ok' : 'down');
        }
        function refreshWidgets() {
            fetch('/api/health').then(r => r.json()).then(h => {
                widget('w-panel', h.panel); widget('w-brain', h.brain); widget('w-eyes', h.eyes);
            }).catch(() => {});
        }
        setInterval(refreshWidgets, 30000);
        refreshWidgets();

        // №16: день/ночь — выбор живёт в localStorage, обе страницы помнят
        function applyTheme(t) {
            document.body.className = (t === 'light') ? 'light' : '';
            const b = document.getElementById('theme');
            if (b) b.textContent = (t === 'light') ? 'ночь' : 'день';
            localStorage.setItem('marfa-theme', t);
        }
        function toggleTheme() {
            applyTheme(document.body.className === 'light' ? 'dark' : 'light');
        }
        applyTheme(localStorage.getItem('marfa-theme') || 'dark');

        // при входе: поднять прошлый разговор из дома (со штампами времени)
        fetch('/api/dialog/' + encodeURIComponent(SID))
            .then(r => r.json())
            .then(d => {
                if (d.turns && d.turns.length) {
                    document.getElementById('chat').innerHTML = '';
                    d.turns.forEach(t => {
                        add(t.role, t.text, t.html);
                        if (t.role === 'assistant') addStamp(t.secs, t.src_label, t.tok, t.ptok);
                    });
                    add('meta', '— разговор продолжается, Марфа помнит —');
                }
            }).catch(() => {});

        // Ф10 «будильник»: открыл панель — назвонившие напоминания
        // встречают первой строкой (текст через textContent — XSS-гигиена №12)
        fetch('/api/reminders').then(r => r.json()).then(d => {
            if (d && d.note) add('ai', d.note);
        }).catch(() => {});

        // МОСТ УШЕЙ (фронт 4 «голос»): ходы, сказанные голосом, приходят
        // из дома, пока окно открыто — опрос раз в 4 с, дёшево и локально.
        // Первый опрос без after — узнаём текущий seq: старые ходы чат не
        // заваливают, живём с настоящего момента (полная история — в сессии
        // voice и журнале data\voice). Пока ход в работе (busy) — честный
        // индикатор «расшифровываю и думаю», не минута молчания.
        let voiceSeq = null, voiceBox = null;
        function voiceTurn(t) {
            if (t.event === 'exchange') {
                const c = document.getElementById('chat');
                const u = document.createElement('div');
                u.className = 'msg user';
                u.textContent = t.phrase;          // гигиена №12: textContent
                const tag = document.createElement('div');
                tag.className = 'vt';
                tag.textContent = 'услышала голосом';
                c.appendChild(u); c.appendChild(tag);
                if (t.answer) {
                    add('ai', t.answer, t.html);
                    addStamp(t.secs, t.src_label || t.src, t.tok, t.ptok);
                }
                c.scrollTop = c.scrollHeight;
            } else if (t.event === 'skip') {
                add('ai', 'голосом: «' + (t.phrase || 'тишина') + '» — ' +
                             (t.why || 'не зов'));
            } else {
                add('ai', 'голосом не вышло: ' + (t.error || 'неизвестно почему'));
            }
        }
        function pollVoice() {
            fetch('/api/voice' + (voiceSeq === null ? '' : '?after=' + voiceSeq))
                .then(r => r.json())
                .then(d => {
                    if (!d || d.seq === undefined) return;
                    const fresh = voiceSeq === null ? [] : (d.turns || []);
                    voiceSeq = d.seq;
                    fresh.forEach(voiceTurn);
                    if (d.busy && !voiceBox) {
                        const c = document.getElementById('chat');
                        voiceBox = document.createElement('div');
                        voiceBox.className = 'typing';
                        voiceBox.innerHTML = '<span class="dots">услышала голосом</span>' +
                                             '<span class="stage">расшифровываю фразу и думаю…</span>';
                        c.appendChild(voiceBox);
                        c.scrollTop = c.scrollHeight;
                    }
                    if ((!d.busy || fresh.length) && voiceBox) {
                        voiceBox.remove(); voiceBox = null;
                    }
                }).catch(() => {});
        }
        setInterval(pollVoice, 4000);
        pollVoice();

        // №14 «кнопка глаз»: один клик — один взгляд. Превью и описание
        // приходят с сервера; всё текстовое — через esc() (XSS-гигиена №12:
        // сенсор — тоже недоверенный источник текста). Глазки заняты —
        // кнопка ждёт честно (disabled), а не плодит взгляды.
        async function look() {
            const btn = document.getElementById('eye');
            if (btn.disabled) return;
            btn.disabled = true;
            const c = document.getElementById('chat');
            const box = document.createElement('div');
            box.className = 'typing';
            box.innerHTML = '<span class="dots">смотрю на экран</span>' +
                            '<span class="stage">глаза читают надписи и кнопки…</span>';
            c.appendChild(box);
            c.scrollTop = c.scrollHeight;
            try {
                const r = await fetch('/api/eyes');
                const d = await r.json();
                box.remove();
                const g = document.createElement('div');
                g.className = 'glance';
                if (d.ok) {
                    g.innerHTML = '<b>Вижу:</b> ' + esc(d.description) +
                                  (d.preview ? '<img src="' + d.preview + '" alt="экран">' : '') +
                                  '<span class="stamp">' + fmtSecs(d.secs) + ' с · глаза</span>';
                } else {
                    g.textContent = 'глаза не смогли: ' + (d.error || 'неизвестно почему');
                }
                c.appendChild(g);
                c.scrollTop = c.scrollHeight;
            } catch (e) {
                box.remove();
                add('ai', 'глаза не смогли: ' + e);
            } finally {
                btn.disabled = false;
            }
        }

        // ЭФИР: индикатор думания — тикающие секунды + живая стадия.
        // «Непонятно, пока не запустишь консоль» — больше не про этот чат:
        // что делает Марфа, видно здесь, консоль не нужна.
        function thinkingBox() {
            const box = document.createElement('div');
            box.className = 'typing';
            box.innerHTML = '<span class="dots">думает</span> <span id="think-secs">0,0 с</span>' +
                            '<span class="stage" id="think-stage"></span>' +
                            '<span class="preview" id="think-preview"></span>';
            document.getElementById('chat').appendChild(box);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
            return box;
        }

        async function send() {
            const i = document.getElementById('inp');
            const t = i.value.trim();
            if(!t) return;
            add('user', t);
            i.value = '';
            const box = thinkingBox();
            const sentAt = Date.now();
            const chatEl = document.getElementById('chat');
            const tick = setInterval(() => {                     // секундомер — свой, не ждём сервера
                const el = document.getElementById('think-secs');
                if (el) el.textContent = fmtSecs((Date.now() - sentAt) / 1000) + ' с';
            }, 500);
            const poll = setInterval(() => {                      // живая стадия из эфира дома
                fetch('/api/progress?session=' + encodeURIComponent(SID))
                    .then(r => r.json())
                    .then(p => {
                        const st = document.getElementById('think-stage');
                        if (!st) return;
                        if (p.busy) {
                            st.textContent = p.mine ? (p.stage || '') : 'отвечает в другом разговоре…';
                        }
                        // СКОРОСТЬ v1: превью — мозг печатает ответ живьём,
                        // чат показывает текст ПО МЕРЕ генерации
                        const pv = document.getElementById('think-preview');
                        if (pv) {
                            pv.textContent = (p.busy && p.mine && p.preview) ? p.preview : '';
                            if (pv.textContent) {
                                document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
                            }
                        }
                    }).catch(() => {});
            }, 1500);
            try {
                const r = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: t, session: SID})
                });
                const d = await r.json();
                add('ai', d.reply || 'Нет ответа', d.html);
                addStamp(d.secs, d.source_label, d.tok, d.ptok);
            } catch(e) {
                add('ai', 'Ошибка: ' + e);
            } finally {
                clearInterval(tick);
                clearInterval(poll);
                box.remove();
                chatEl.scrollTop = chatEl.scrollHeight;
            }
        }
    </script>
</body>
</html>
